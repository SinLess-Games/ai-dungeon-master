name: Bug report
description: Report a problem with The Endless Codex
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve The Endless Codex. Issues created with this form are synchronized into the admin Feedback inbox.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What steps consistently cause the problem?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web
        - Android
        - Windows
        - API
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or other useful information. Do not include secrets or private account data.
