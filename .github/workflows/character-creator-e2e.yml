name: Character Creator E2E

on:
  pull_request:
    paths:
      - ".github/workflows/character-creator-e2e.yml"
      - "drizzle/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/seed-content.mjs"
      - "seeds/**"
      - "src/components/layout/site-header.tsx"
      - "src/components/layout/site-header.css"
      - "src/infrastructure/database/**"
      - "src/modules/characters/**"
      - "src/modules/campaigns/**"
      - "src/modules/auth/**"
      - "src/server/**"
      - "tests/e2e/character-creator.e2e.mjs"
      - "tests/e2e/character-creator-ui.e2e.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-creator-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  creator-e2e:
    name: creator-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local D1 migrate and seed bootstrap
        run: npm run db:seed:local

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Character creator API and browser E2E tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:creator 2>&1 | tee character-creator-e2e.log

      - name: Upload failing E2E log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: character-creator-e2e-log
          path: character-creator-e2e.log
          if-no-files-found: error
