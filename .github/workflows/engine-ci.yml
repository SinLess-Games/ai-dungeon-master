name: Engine Core CI

on:
  push:
    branches:
      - main
    paths:
      - "src/engine/**"
      - "tests/unit/engine-*.test.ts"
      - "docs/engine.md"
      - ".github/workflows/engine-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
  pull_request:
    branches:
      - main
    paths:
      - "src/engine/**"
      - "tests/unit/engine-*.test.ts"
      - "docs/engine.md"
      - ".github/workflows/engine-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
