name: Finalize creator CI fix

on:
  push:
    branches:
      - feature/creator-advanced-options

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-advanced-options
      - name: Repair spell prerequisite typing
        run: |
          sed -i 's/const spellAccess: Array<{ level: number; tradition: string; classId: string }> = \[\];/const spellAccess: Array<{ level: number; tradition: "arcane" | "divine" | "psionic" | "other"; classId: string }> = [];/g' src/modules/characters/server/featCreationRoutes.ts
          grep -F 'const spellAccess: Array<{ level: number; tradition: "arcane" | "divine" | "psionic" | "other"; classId: string }> = [];' src/modules/characters/server/featCreationRoutes.ts
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-creator-ci-fix.yml
          git add src/modules/characters/server/featCreationRoutes.ts
          git commit -m "fix(character): type spell prerequisite access"
          git push origin HEAD:feature/creator-advanced-options
