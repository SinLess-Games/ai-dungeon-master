name: Seed CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seed-ci.yml"
      - "drizzle/**"
      - "scripts/seed-content.mjs"
      - "seeds/**"
      - "src/infrastructure/database/schema/**"
      - "tests/unit/*seed*.test.ts"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/seed-ci.yml"
      - "drizzle/**"
      - "scripts/seed-content.mjs"
      - "seeds/**"
      - "src/infrastructure/database/schema/**"
      - "tests/unit/*seed*.test.ts"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seed-unit:
    name: seed-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed unit tests
        run: npm run test:unit:seeds

  d1-bootstrap:
    name: d1-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local D1 migrate and full seed bootstrap
        shell: bash
        run: |
          set -o pipefail
          npm run db:seed:local -- --yes 2>&1 | tee seed-ci.log

      - name: Upload failing seed log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seed-ci-log
          path: seed-ci.log
          if-no-files-found: warn
