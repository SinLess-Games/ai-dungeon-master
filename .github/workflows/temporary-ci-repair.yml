name: Temporary creator CI repair

on:
  push:
    branches:
      - feature/creator-advanced-options

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-advanced-options
      - name: Apply targeted TypeScript repairs
        run: node scripts/temporary-ci-repair.mjs
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/characters/server/featCreationRoutes.ts src/modules/characters/ui/AdvancedCharacterCreator.tsx
          git commit -m "fix(character): satisfy strict creator types"
          git push origin HEAD:feature/creator-advanced-options
